<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Circular Badge Background -->
  <circle cx="50" cy="50" r="48" fill="#0b0f19" stroke="#1e293b" stroke-width="2" />
  
  <!-- Graph Edges forming V -->
  <g stroke="url(#vGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#glow)">
    <!-- Left Wing -->
    <line x1="22" y1="28" x2="36" y2="28" />
    <line x1="22" y1="28" x2="30" y2="46" />
    <line x1="36" y1="28" x2="30" y2="46" />
    <line x1="36" y1="28" x2="44" y2="42" />
    <line x1="30" y1="46" x2="42" y2="60" />
    <line x1="44" y1="42" x2="42" y2="60" />
    
    <!-- Central Vertex -->
    <line x1="42" y1="60" x2="50" y2="76" />
    <line x1="58" y1="60" x2="50" y2="76" />
    <line x1="44" y1="42" x2="50" y2="55" />
    <line x1="56" y1="42" x2="50" y2="55" />
    <line x1="50" y1="55" x2="50" y2="76" />
    <line x1="42" y1="60" x2="58" y2="60" />

    <!-- Right Wing -->
    <line x1="78" y1="28" x2="64" y2="28" />
    <line x1="78" y1="28" x2="70" y2="46" />
    <line x1="64" y1="28" x2="70" y2="46" />
    <line x1="64" y1="28" x2="56" y2="42" />
    <line x1="70" y1="46" x2="58" y2="60" />
    <line x1="56" y1="42" x2="58" y2="60" />
  </g>

  <!-- Graph Nodes (Vertices) -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="22" cy="28" r="3.2" fill="#38bdf8" />
    <circle cx="36" cy="28" r="3" fill="#38bdf8" />
    <circle cx="30" cy="46" r="3.2" fill="#60a5fa" />
    <circle cx="44" cy="42" r="3" fill="#818cf8" />
    <circle cx="42" cy="60" r="3.2" fill="#a855f7" />
    
    <circle cx="50" cy="55" r="2.8" fill="#c084fc" />
    <circle cx="50" cy="76" r="3.8" fill="#38bdf8" />

    <circle cx="78" cy="28" r="3.2" fill="#c084fc" />
    <circle cx="64" cy="28" r="3" fill="#c084fc" />
    <circle cx="70" cy="46" r="3.2" fill="#a855f7" />
    <circle cx="56" cy="42" r="3" fill="#818cf8" />
    <circle cx="58" cy="60" r="3.2" fill="#a855f7" />
  </g>
</svg>
