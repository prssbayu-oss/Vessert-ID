<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VessertID - Nostr Loader Example</title>
  <link rel="stylesheet" href="/src/index.css" />
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  </style>
</head>
<body class="p-6 max-w-4xl mx-auto space-y-6">
  <div class="border-b border-slate-800 pb-4 flex items-center justify-between">
    <div>
      <span class="text-xs font-mono text-purple-400 bg-purple-950 px-2.5 py-1 rounded border border-purple-800">examples / loaders / nostr</span>
      <h1 class="text-2xl font-bold text-white mt-2">Nostr NIP-01 &amp; NIP-25 Event Ingestion</h1>
      <p class="text-xs text-slate-400 mt-1">Loads raw event assets <code class="text-purple-300">event_kind1.json</code> &amp; <code class="text-purple-300">event_kind7.json</code> via <code class="text-purple-300">NostrEventParser</code>.</p>
    </div>
    <a href="/examples/index.html" class="text-xs font-mono text-indigo-400 hover:underline">&larr; Back to Examples</a>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="p-4 rounded-xl bg-slate-900 border border-slate-800 space-y-2">
      <div class="text-xs font-mono font-bold text-slate-400">1. Kind 1 Note Event</div>
      <div id="note-card" class="space-y-2">// Ingesting note...</div>
    </div>
    <div class="p-4 rounded-xl bg-slate-900 border border-slate-800 space-y-2">
      <div class="text-xs font-mono font-bold text-slate-400">2. Kind 7 Reaction Event</div>
      <div id="reaction-card" class="space-y-2">// Ingesting reaction...</div>
    </div>
  </div>

  <script type="module">
    import * as Vessert from '/src/VessertID.js';
    import { NostrEventParser } from '/examples/jsm/loaders/nostr/NostrEventParser.js';

    async function run() {
      const parser = new NostrEventParser();

      // Kind 1 Note
      const res1 = await fetch('/examples/data/nostr/event_kind1.json');
      const raw1 = await res1.json();
      const note = parser.parse(raw1);

      document.getElementById('note-card').innerHTML = `
        <div class="p-3 rounded-lg bg-slate-950 border border-slate-800 space-y-2 text-xs">
          <div class="font-mono text-purple-300 font-bold">${note.author.slice(0, 28)}...</div>
          <p class="text-slate-200">"${note.text}"</p>
          <div class="text-[11px] font-mono text-slate-500">Context: ${note.address.context} &bull; Time: ${new Date(note.address.time).toLocaleString()}</div>
        </div>
      `;

      // Kind 7 Reaction
      const res7 = await fetch('/examples/data/nostr/event_kind7.json');
      const raw7 = await res7.json();
      const reaction = parser.parse(raw7);

      document.getElementById('reaction-card').innerHTML = `
        <div class="p-3 rounded-lg bg-slate-950 border border-slate-800 space-y-2 text-xs">
          <div class="font-mono text-emerald-300 font-bold">${reaction.author.slice(0, 28)}...</div>
          <p class="text-slate-200">Reaction Symbol: <strong class="text-emerald-400 text-lg">${reaction.reactionType}</strong></p>
          <div class="text-[11px] font-mono text-slate-500">Target: ${reaction.address.to.slice(0, 24)}...</div>
        </div>
      `;
    }
    run();
  </script>
</body>
</html>
