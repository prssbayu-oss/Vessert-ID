<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VessertID - ATProto Loader Example</title>
  <link rel="stylesheet" href="/src/index.css" />
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  </style>
</head>
<body class="p-6 max-w-4xl mx-auto space-y-6">
  <div class="border-b border-slate-800 pb-4 flex items-center justify-between">
    <div>
      <span class="text-xs font-mono text-sky-400 bg-sky-950 px-2.5 py-1 rounded border border-sky-800">examples / loaders / atproto</span>
      <h1 class="text-2xl font-bold text-white mt-2">ATProto Raw Asset Ingestion</h1>
      <p class="text-xs text-slate-400 mt-1">Loads raw <code class="text-sky-300">examples/data/atproto/post.json</code> via <code class="text-sky-300">BlueskyPostParser</code> into a native VessertID Post Node.</p>
    </div>
    <a href="/examples/index.html" class="text-xs font-mono text-indigo-400 hover:underline">&larr; Back to Examples</a>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="p-4 rounded-xl bg-slate-900 border border-slate-800 space-y-2">
      <div class="text-xs font-mono font-bold text-slate-400">1. Raw Asset File (JSON)</div>
      <pre id="raw-json" class="p-3 bg-black/50 rounded-lg text-xs font-mono text-sky-300 overflow-x-auto max-h-72">// Loading...</pre>
    </div>
    <div class="p-4 rounded-xl bg-slate-900 border border-slate-800 space-y-2">
      <div class="text-xs font-mono font-bold text-slate-400">2. Resulting VessertID Post Node</div>
      <div id="node-inspector" class="space-y-3 pt-2">// Ingesting...</div>
    </div>
  </div>

  <script type="module">
    import * as Vessert from '/src/VessertID.js';
    import { BlueskyPostParser } from '/examples/jsm/loaders/bluesky/BlueskyPostParser.js';

    async function run() {
      const res = await fetch('/examples/data/atproto/post.json');
      const raw = await res.json();
      document.getElementById('raw-json').textContent = JSON.stringify(raw, null, 2);

      const parser = new BlueskyPostParser();
      const post = parser.parse(raw, 'did:plc:alice777');

      const inspector = document.getElementById('node-inspector');
      inspector.innerHTML = `
        <div class="p-3.5 rounded-lg bg-slate-950 border border-slate-800 space-y-2 text-xs">
          <div class="flex items-center justify-between">
            <span class="font-mono text-sky-400 font-bold">${post.author}</span>
            <span class="font-mono text-[10px] bg-slate-800 px-2 py-0.5 rounded text-slate-300">Node type: ${post.type}</span>
          </div>
          <p class="text-slate-200 text-sm">"${post.text}"</p>
          <div class="pt-2 border-t border-slate-900 font-mono text-[11px] text-slate-400 space-y-1">
            <div>Address4: [${post.address.from}, ${post.address.to}, ${post.address.context}, ${post.address.time}]</div>
            <div>UUID: ${post.uuid}</div>
            <div>Signal Format: ${post.signal.format}</div>
          </div>
        </div>
      `;
    }
    run();
  </script>
</body>
</html>
